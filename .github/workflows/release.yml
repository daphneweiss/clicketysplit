name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for PyPI trusted publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify static assets are bundled into the wheel
        run: |
          WHEEL=$(ls dist/clicketysplit-*.whl | head -1)
          echo "Inspecting $WHEEL"
          python -m zipfile -l "$WHEEL" | grep -q "clicketysplit/server/static/index.html" \
            || (echo "wheel is missing clicketysplit/server/static/index.html" && \
                python -m zipfile -l "$WHEEL" && exit 1)
          python -m zipfile -l "$WHEEL" | grep -q "clicketysplit/server/static/assets/" \
            || (echo "wheel is missing clicketysplit/server/static/assets/*" && \
                python -m zipfile -l "$WHEEL" && exit 1)

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
