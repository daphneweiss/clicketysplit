name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs git history for version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        continue-on-error: true
        run: mypy src/clicketysplit

      - name: Test (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify bundled static index.html exists
        run: |
          test -f src/clicketysplit/server/static/index.html \
            || (echo "frontend build did not emit index.html" && exit 1)
