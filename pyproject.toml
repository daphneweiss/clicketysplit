[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "clicketysplit"
dynamic = ["version"]
description = "A browser-based tool for segmenting and exporting word tokens from speech recordings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Daphne Weiss" }]
keywords = ["audio", "segmentation", "phonetics", "speech", "psycholinguistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "flask>=3.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",       # WAV/FLAC/OGG read+write
  "pydantic>=2.5",         # config schema validation
  "matplotlib>=3.7",       # overview plot for sanity-checks
  # Silero VAD is not optional: it is the detector the boundary refinement
  # and duration thresholds were tuned against. The bundled energy detector
  # over-segments real speech badly enough that shipping it as the default
  # would misrepresent the tool.
  "silero-vad>=5.0",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
webrtc  = ["webrtcvad>=2.0.10"]
denoise = ["noisereduce>=3.0"]
mp3     = ["pydub>=0.25"]           # also requires ffmpeg on PATH (system)
praat   = ["praat-parselmouth>=0.4"]
all = [
  "clicketysplit[webrtc,denoise,mp3,praat]",
]
dev = [
  "pytest>=7.4",
  "pytest-cov",
  # Pinned: an unpinned linter means CI breaks whenever ruff/mypy ship new
  # default rules, with no code change on our side.
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<2.4",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]

[project.scripts]
clicketysplit = "clicketysplit.cli:main"

[project.urls]
Homepage      = "https://github.com/daphneweiss/clicketysplit"
Documentation = "https://daphneweiss.github.io/clicketysplit"
Issues        = "https://github.com/daphneweiss/clicketysplit/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/clicketysplit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clicketysplit"]
# The pre-built Svelte frontend lives at src/clicketysplit/server/static/
# and is gitignored (it's a build artifact regenerated by `npm run build`).
# Hatchling filters gitignored files by default, so we use force-include to
# override that for the static dir. demo_assets/ is NOT gitignored and is
# already picked up as a Python sub-package.
[tool.hatch.build.targets.wheel.force-include]
"src/clicketysplit/server/static" = "clicketysplit/server/static"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# Deliberately no python_version pin: mypy then targets whichever
# interpreter it runs under, which is what the CI matrix wants. Pinning it
# to 3.10 made mypy read modern numpy stubs (PEP 695 `type` statements)
# under a 3.10 target and fail with a syntax error.

# Audio/DSP libraries that ship no type stubs. Everything of ours that
# wraps them is still checked; only the library boundary is untyped.
[[tool.mypy.overrides]]
module = [
  "noisereduce.*",
  "pydub.*",
  "scipy.*",
  "silero_vad.*",
  "soundfile.*",
  "webrtcvad.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "needs_silero: requires silero-vad",
    "needs_webrtc: requires webrtcvad",
    "needs_ffmpeg: requires ffmpeg on PATH",
    "needs_praat: requires praat-parselmouth",
    "slow: takes >1s",
]
