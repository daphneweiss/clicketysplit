[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "clicketysplit"
dynamic = ["version"]
description = "A browser-based tool for segmenting and exporting word tokens from speech recordings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Daphne Weiss", email = "daphnerweiss@gmail.com" }]
keywords = ["audio", "segmentation", "phonetics", "speech", "psycholinguistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "flask>=3.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",       # WAV/FLAC/OGG read+write
  "pydantic>=2.5",         # config schema validation
  "matplotlib>=3.7",       # overview plot for sanity-checks
]

[project.optional-dependencies]
silero  = ["silero-vad>=5.0", "onnxruntime>=1.16"]
webrtc  = ["webrtcvad>=2.0.10"]
denoise = ["noisereduce>=3.0"]
mp3     = ["pydub>=0.25"]           # also requires ffmpeg on PATH (system)
praat   = ["praat-parselmouth>=0.4"]
all = [
  "clicketysplit[silero,webrtc,denoise,mp3,praat]",
]
dev = [
  "pytest>=7.4",
  "pytest-cov",
  "ruff",
  "mypy",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]

[project.scripts]
clicketysplit = "clicketysplit.cli:main"

[project.urls]
Homepage      = "https://github.com/daphneweiss/clicketysplit"
Documentation = "https://daphneweiss.github.io/clicketysplit"
Issues        = "https://github.com/daphneweiss/clicketysplit/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/clicketysplit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clicketysplit"]
# The pre-built Svelte frontend lives at src/clicketysplit/server/static/
# and is gitignored (it's a build artifact regenerated by `npm run build`).
# Hatchling filters gitignored files by default, so we use force-include to
# override that for the static dir. demo_assets/ is NOT gitignored and is
# already picked up as a Python sub-package.
[tool.hatch.build.targets.wheel.force-include]
"src/clicketysplit/server/static" = "clicketysplit/server/static"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "needs_silero: requires silero-vad",
    "needs_webrtc: requires webrtcvad",
    "needs_ffmpeg: requires ffmpeg on PATH",
    "needs_praat: requires praat-parselmouth",
    "slow: takes >1s",
]
